name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[test]'
      - run: pytest
      - run: python scripts/verify_release.py
      - run: python scripts/reproduce_components.py
      - run: python scripts/reproduce_end_to_end.py
