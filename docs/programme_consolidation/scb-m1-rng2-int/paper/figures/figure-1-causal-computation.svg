<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
<title id="title">Mandatory learned causal computation</title>
<desc id="desc">Visible inputs produce hard z2, a registered transition produces hard z3, and the answer head reads only z3.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/>
</marker>
</defs>
<rect width="1400" height="390" fill="#ffffff"/>
<text x="700" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#1f2933">Mandatory learned causal computation</text>
<rect x="55" y="130" width="210" height="105" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="160.0" y="188.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Visible inputs</text>
<rect x="330" y="130" width="220" height="105" rx="12" fill="#e8f4ef" stroke="#17324d" stroke-width="2"/>
<text x="440.0" y="177.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Predicted</text>
<text x="440.0" y="199.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">hard z2</text>
<rect x="650" y="130" width="250" height="105" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="775.0" y="177.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Registered transition</text>
<text x="775.0" y="199.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">hard z2 + d</text>
<rect x="1000" y="130" width="210" height="105" rx="12" fill="#e8f4ef" stroke="#17324d" stroke-width="2"/>
<text x="1105.0" y="177.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Predicted</text>
<text x="1105.0" y="199.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">hard z3</text>
<rect x="1250" y="130" width="120" height="105" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="1310.0" y="188.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Answer</text>
<line x1="265" y1="182" x2="330" y2="182" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="550" y1="182" x2="650" y2="182" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="900" y1="182" x2="1000" y2="182" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1210" y1="182" x2="1250" y2="182" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="690" y="285" width="170" height="65" rx="12" fill="#ffffff" stroke="#aab7c2" stroke-width="2"/>
<text x="775.0" y="323.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Registered d</text>
<line x1="775" y1="285" x2="775" y2="238" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="700" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52616f">No encoder, prompt, soft-logit, or true-state bypass</text>
</svg>

