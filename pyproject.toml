[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-provenance-paper1"
version = "1.0.0"
description = "Code and evidence for authenticated causal-state carriage in generated text"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "numpy==2.2.6",
  "cryptography==46.0.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
exp33ae = "exp33ae.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
