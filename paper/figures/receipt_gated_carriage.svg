<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
<title id="title">Receipt-gated abstract state carriage</title>
<desc id="desc">Exact events and an abstract z2 receipt are verified before authority derivation, position-indexed generation, and scoring under 16 authorities.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/>
</marker>
</defs>
<rect width="1500" height="560" fill="#ffffff"/>
<text x="750" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#1f2933">Receipt-gated abstract state carriage</text>
<rect x="45" y="100" width="220" height="75" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="155.0" y="143.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Exact z2 event</text>
<rect x="45" y="205" width="220" height="75" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="155.0" y="248.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Exact z3 event</text>
<rect x="45" y="310" width="220" height="75" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="155.0" y="353.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Answer digest</text>
<rect x="45" y="425" width="220" height="75" rx="12" fill="#e8f4ef" stroke="#17324d" stroke-width="2"/>
<text x="155.0" y="468.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Abstract z2 receipt</text>
<rect x="350" y="175" width="260" height="130" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="480.0" y="224.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Verify exact</text>
<text x="480.0" y="246.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">z2 → z3 → answer</text>
<text x="480.0" y="268.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">chain</text>
<rect x="350" y="405" width="260" height="95" rx="12" fill="#e8f4ef" stroke="#17324d" stroke-width="2"/>
<text x="480.0" y="447.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Verify abstract</text>
<text x="480.0" y="469.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">state class</text>
<rect x="700" y="245" width="220" height="105" rx="12" fill="#faf1df" stroke="#9b6a12" stroke-width="2"/>
<text x="810.0" y="292.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Generation gate</text>
<text x="810.0" y="314.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">both must pass</text>
<rect x="1000" y="245" width="220" height="105" rx="12" fill="#e8f4ef" stroke="#17324d" stroke-width="2"/>
<text x="1110.0" y="292.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Derive state-class</text>
<text x="1110.0" y="314.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">authority</text>
<rect x="1300" y="145" width="160" height="105" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="1380.0" y="192.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">RNG2</text>
<text x="1380.0" y="214.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">fixed draws</text>
<rect x="1300" y="345" width="160" height="105" rx="12" fill="#e8f1f8" stroke="#17324d" stroke-width="2"/>
<text x="1380.0" y="392.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">Score all</text>
<text x="1380.0" y="414.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#1f2933">16 authorities</text>
<line x1="265" y1="137" x2="350" y2="205" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="265" y1="242" x2="350" y2="235" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="265" y1="347" x2="350" y2="265" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="265" y1="462" x2="350" y2="452" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610" y1="240" x2="700" y2="275" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610" y1="452" x2="700" y2="320" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="920" y1="297" x2="1000" y2="297" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1220" y1="297" x2="1300" y2="198" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1380" y1="250" x2="1380" y2="345" stroke="#17324d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1110" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#52616f">Authority excludes receipt bytes</text>
<text x="1110" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#52616f">and exact execution identity</text>
<text x="750" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52616f">Carrier compatibility expresses the abstract state class—not exact execution identity</text>
</svg>

